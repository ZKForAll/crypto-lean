name = "CryptoLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CryptoLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # not upstreaming to Mathlib; skip the copyright-header linter
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "CryptoLean"
